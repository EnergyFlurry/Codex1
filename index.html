<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="description" content="A realistic rain-on-the-window simulation with ambient rain sounds and calming music.">
  <title>Rainy Window</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view" aria-label="Rain running down a window pane"></canvas>

  <!-- Window frame overlay -->
  <div id="frame" class="frame" aria-hidden="true">
    <div class="frame__sill"></div>
  </div>

  <!-- Intro / audio unlock -->
  <div id="intro" class="intro" role="dialog" aria-labelledby="intro-title">
    <div class="intro__card">
      <h1 id="intro-title">Rainy Window</h1>
      <p>Sit back. It's raining outside.</p>
      <button id="start" class="btn btn--primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        Start with sound
      </button>
      <button id="start-silent" class="btn btn--ghost" type="button">Continue without sound</button>
      <small>Headphones recommended · Drag on the glass to wipe it</small>
    </div>
  </div>

  <!-- Floating controls -->
  <div id="dock" class="dock">
    <button id="btn-sound" class="icon-btn" type="button" title="Mute / unmute (M)" aria-label="Toggle sound">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm12.6 3 2.9-2.9-1.4-1.4-2.9 2.9-2.9-2.9-1.4 1.4 2.9 2.9-2.9 2.9 1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4z"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" type="button" title="Settings (S)" aria-label="Open settings" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>

  <!-- Settings panel -->
  <aside id="panel" class="panel" aria-label="Settings" aria-hidden="true">
    <header class="panel__head">
      <h2>Settings</h2>
      <button id="btn-close" class="icon-btn icon-btn--small" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>
    <div id="panel-body" class="panel__body"></div>
    <footer class="panel__foot">
      <button id="btn-pause" class="btn btn--small" type="button">Pause rain</button>
      <button id="btn-full" class="btn btn--small" type="button">Fullscreen</button>
      <button id="btn-reset" class="btn btn--small btn--ghost" type="button">Reset</button>
      <p class="keys"><kbd>S</kbd> settings · <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen · <kbd>Space</kbd> pause · <kbd>H</kbd> hide UI</p>
    </footer>
  </aside>

  <div id="fallback" class="fallback" hidden>
    <p>Your browser doesn't support WebGL, which this rain simulation needs.</p>
  </div>

  <script src="js/scenes.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
